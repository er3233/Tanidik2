<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurye Paneli | TANIDIK</title>
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/courier-dispatch.css" />
</head>

<body>
  <nav class="navbar">
    <h1>TANIDIK</h1>
    <div class="nav-links">
      <button type="button" id="courierLogoutBtn" class="secondary-btn">Çıkış</button>
    </div>
  </nav>

  <main id="courierPage" class="order-page courier-page">
    <header class="dashboard-header">
      <span class="dashboard-kicker">Kurye</span>
      <h1>Teslimat Paneli</h1>
      <p class="page-message" id="courierWelcome"></p>
    </header>

    <div id="courierAccessDenied" class="courier-access-denied dashboard-section" hidden>
      <h2>Erişim engellendi</h2>
      <p class="page-message">
        Bu panel yalnızca aktif kurye hesapları içindir. Admin tarafından kurye olarak tanımlanmanız gerekir.
      </p>
      <a href="./auth.html?redirect=./courier.html" class="secondary-btn">Giriş sayfasına dön</a>
    </div>

    <div id="courierPanelContent" hidden>
      <div class="courier-toolbar dashboard-section">
        <button type="button" id="courierRefreshBtn" class="secondary-btn">Yenile</button>
        <span class="courier-refresh-meta" id="courierRefreshMeta">Otomatik yenileme: 25 sn</span>
      </div>

      <section class="dashboard-section">
        <h2>Açık Teslimatlar</h2>
        <div id="courierAvailableList" class="order-list" aria-live="polite"></div>
      </section>

      <section class="dashboard-section">
        <h2>Atanan Teslimatlar</h2>
        <div id="courierAssignedList" class="order-list" aria-live="polite"></div>
      </section>

      <section class="dashboard-section">
        <h2>Kurye Profili</h2>
        <dl id="courierProfileCard" class="courier-profile-card"></dl>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="./js/app.js"></script>
  <div id="toast" class="toast"></div>
</body>

</html>
