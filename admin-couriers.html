<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurye Yönetimi | TANIDIK</title>
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <nav class="navbar">
    <h1>TANIDIK</h1>
    <div class="nav-links">
      <a href="./admin.html">Admin Panel</a>
    </div>
  </nav>

  <main id="adminCouriersPage" class="admin-page order-page">
    <header class="dashboard-header dashboard-header--admin">
      <h1>Kurye Yönetimi</h1>
      <p class="page-message">Kurye hesaplarını oluşturun ve durumlarını yönetin.</p>
      <a href="./admin.html" class="secondary-btn">← Admin Panel</a>
    </header>

    <section class="admin-section dashboard-section">
      <form id="adminCourierForm" class="admin-form">
        <input type="email" id="adminCourierEmail" placeholder="Kurye e-posta (kayıtlı kullanıcı)" required />
        <input type="text" id="adminCourierFullName" placeholder="Ad Soyad" required />
        <input type="text" id="adminCourierPhone" placeholder="Telefon" />
        <input type="text" id="adminCourierVehicle" placeholder="Araç tipi" />
        <select id="adminCourierStatus">
          <option value="active">Aktif</option>
          <option value="inactive">Pasif</option>
          <option value="suspended">Askıda</option>
        </select>
        <button type="submit" class="btn">Kaydet</button>
      </form>

      <div id="adminCouriersList" class="admin-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="./js/app.js"></script>
  <div id="toast" class="toast"></div>
</body>

</html>
