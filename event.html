<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Event Details | TANIDIK</title>

  <meta
    name="description"
    content="View event details, venue information, and countdowns on TANIDIK."
  />

  <meta name="theme-color" content="#050505" />

  <link
    rel="icon"
    href="./assets/favicon.svg"
    type="image/svg+xml"
  />

  <link rel="manifest" href="./manifest.webmanifest" />

  <link rel="apple-touch-icon" href="./assets/icon-192.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TANIDIK" />
  <meta property="og:title" content="Event Details | TANIDIK" />
  <meta
    property="og:description"
    content="View event details, venue information, and countdowns on TANIDIK."
  />
  <meta property="og:url" content="https://tanidik2.vercel.app" />
  <meta property="og:image" content="https://tanidik2.vercel.app/assets/social-preview.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Event Details | TANIDIK" />
  <meta
    name="twitter:description"
    content="View event details, venue information, and countdowns on TANIDIK."
  />
  <meta name="twitter:image" content="https://tanidik2.vercel.app/assets/social-preview.png" />

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/event-premium.css" />
</head>

<body>

  <nav class="navbar">

    <h1>TANIDIK</h1>

    <button
      class="nav-toggle"
      type="button"
      aria-label="Toggle navigation"
      aria-expanded="false"
    >
      Menu
    </button>

    <div class="nav-links">
      <a href="./index.html">Home</a>
      <a href="./discover.html">Discover</a>
      <a href="./food.html" data-nav-page="food.html">Yemek</a>
      <a href="./events.html">Events</a>
      <a href="./favorites.html">Favorites</a>
      <a href="./auth.html" id="authLink">Login</a>
    </div>

  </nav>

  <main class="venue-page event-detail-page ep-main">

    <!-- ─── Full-bleed hero ─── -->
    <div class="ep-hero">

      <img
        id="eventImage"
        class="venue-hero-image ep-hero-img"
        alt="Event image"
      />

      <div class="ep-hero-overlay"></div>

      <!-- Top bar: back -->
      <div class="ep-hero-topbar">
        <a href="./events.html" class="ep-back-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 13L5 8l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Events
        </a>
      </div>

      <!-- Hero footer: kicker + title -->
      <div class="ep-hero-footer">
        <span class="ep-kicker">TANIDIK Event</span>
        <h1 id="eventTitle">Loading…</h1>
      </div>

    </div>

    <!-- ─── Scrollable content ─── -->
    <div class="ep-content">

      <!-- Action pill row (always visible) -->
      <div
        class="event-mobile-actions ep-actions-row"
        aria-label="Event detail sections"
      >
        <button type="button" data-event-panel="rsvp" class="ep-action--primary">Join / RSVP</button>
        <button type="button" data-event-panel="details">Details</button>
        <button type="button" data-event-panel="location">Location</button>
        <button type="button" data-event-panel="venue">Venue</button>
      </div>

      <!-- RSVP / Join panel -->
      <section
        class="ep-card event-mobile-panel event-rsvp-panel"
        data-panel="rsvp"
      >
        <div class="ep-section-header">
          <span class="ep-section-kicker">Attendance</span>
          <h2>Join / RSVP</h2>
        </div>

        <div
          id="eventAttendance"
          class="event-attendance"
        ></div>
      </section>

      <!-- Details panel (open by default) -->
      <section
        class="ep-card event-mobile-panel event-details-panel is-open"
        data-panel="details"
      >
        <div class="ep-section-header">
          <h2>Event Details</h2>
        </div>

        <p id="eventDate" class="ep-date"></p>

        <p id="eventDescription" class="ep-description"></p>
      </section>

      <!-- Location panel -->
      <section
        class="ep-card event-mobile-panel event-location-panel"
        data-panel="location"
      >
        <div class="ep-section-header">
          <h2>Location</h2>
        </div>

        <p id="eventLocation">Location details are connected to the venue.</p>
      </section>

      <!-- Venue panel -->
      <section
        class="ep-card event-mobile-panel event-venue-panel"
        data-panel="venue"
      >
        <div class="ep-section-header">
          <h2>Venue</h2>
        </div>

        <p id="eventVenue" class="ep-venue-info"></p>

        <a href="./events.html" class="ep-back-link">← Back to Events</a>
      </section>

    </div>

  </main>

  <nav
    class="mobile-bottom-nav"
    aria-label="Primary mobile navigation"
  >
    <a href="./index.html" data-nav-page="index.html"><span aria-hidden="true">H</span>Home</a>
    <a href="./discover.html" data-nav-page="discover.html"><span aria-hidden="true">D</span>Discover</a>
    <a href="./store.html" data-nav-page="store.html"><span aria-hidden="true">S</span>Store</a>
    <a href="./messages.html" data-nav-page="messages.html"><span aria-hidden="true">M</span>Messages</a>
    <a href="./profile.html" data-nav-page="profile.html"><span aria-hidden="true">P</span>Profile</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="./js/app.js"></script>

  <div id="toast" class="toast"></div>

</body>
</html>
