  <!-- Takvim + filtre JS -->
  <script>
  (function () {
    /* ── State ── */
    var calYear  = new Date().getFullYear();
    var calMonth = new Date().getMonth(); // 0-indexed
    var activeFilter  = 'all';
    var activeDateKey = null; // 'YYYY-MM-DD' or null

    var TR_MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran',
                     'Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    var TR_DAYS   = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

    /* ── Helpers ── */
    function parseDate(str) {
      if (!str || str === 'Belirtilmedi') return null;
      var m;
      // YYYY-MM-DD
      m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) return new Date(+m[1], +m[2]-1, +m[3]);
      // DD.MM.YYYY or DD/MM/YYYY
      m = str.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);
      if (m) return new Date(+m[3], +m[2]-1, +m[1]);
      // Try native parse
      var d = new Date(str);
      return isNaN(d) ? null : d;
    }

    function toKey(d) {
      return d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0');
    }

    /* ── Extract reservations from rendered DOM cards ── */
    function extractReservations() {
      var map = {}; // dateKey -> [status,...]
      var list = document.getElementById('profileReservationsList');
      if (!list) return map;
      var cards = list.querySelectorAll('.reservation-card');
      cards.forEach(function(card) {
        // get status
        var statusCls = Array.from(card.classList)
          .find(function(c){ return c.startsWith('status-'); });
        var status = statusCls ? statusCls.replace('status-','') : 'pending';

        // get date from meta — label "Date" span + value strong
        var metaItems = card.querySelectorAll('.reservation-meta-item');
        var dateVal = null;
        metaItems.forEach(function(item) {
          var lbl = item.querySelector('span');
          var val = item.querySelector('strong');
          if (lbl && val && lbl.textContent.trim() === 'Date') {
            dateVal = val.textContent.trim();
          }
        });

        if (dateVal) {
          var d = parseDate(dateVal);
          if (d) {
            var key = toKey(d);
            if (!map[key]) map[key] = [];
            map[key].push(status);
          }
        }
      });
      return map;
    }

    /* ── Navigate to month that has most reservations ── */
    function autoNavigate(dateMap) {
      var keys = Object.keys(dateMap);
      if (!keys.length) return;
      // Find most recent upcoming or latest past month
      var now = new Date();
      var best = null;
      keys.forEach(function(k) {
        var d = parseDate(k);
        if (!d) return;
        if (!best) { best = d; return; }
        // Prefer future dates, then most recent past
        var bDiff = best - now;
        var dDiff = d - now;
        if (dDiff >= 0 && bDiff < 0) { best = d; return; }
        if (dDiff >= 0 && bDiff >= 0 && dDiff < bDiff) { best = d; return; }
        if (dDiff < 0 && bDiff < 0 && dDiff > bDiff) { best = d; return; }
      });
      if (best) {
        calYear  = best.getFullYear();
        calMonth = best.getMonth();
      }
    }

    /* ── Build calendar ── */
    function buildCalendar() {
      var cal   = document.getElementById('rvCalendar');
      var label = document.getElementById('rvCalMonthLabel');
      if (!cal || !label) return;

      label.textContent = TR_MONTHS[calMonth] + ' ' + calYear;

      var dateMap = extractReservations();
      var today   = new Date();
      var todayKey = toKey(today);

      var html = '<div class="rv-cal-grid">';

      // Day headers
      TR_DAYS.forEach(function(d) {
        html += '<div class="rv-cal-dow">' + d + '</div>';
      });

      // First day of month (0=Sun, adjust to Mon=0)
      var firstDay = new Date(calYear, calMonth, 1).getDay();
      firstDay = (firstDay + 6) % 7; // Mon=0

      // Empty cells
      for (var i = 0; i < firstDay; i++) {
        html += '<div class="rv-cal-empty"></div>';
      }

      // Days
      var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
      for (var day = 1; day <= daysInMonth; day++) {
        var key = calYear + '-' +
          String(calMonth+1).padStart(2,'0') + '-' +
          String(day).padStart(2,'0');
        var statuses = dateMap[key] || [];
        var isToday  = key === todayKey;
        var isActive = key === activeDateKey;
        var hasRsv   = statuses.length > 0;

        var cls = 'rv-cal-day';
        if (isToday)  cls += ' rv-cal-day--today';
        if (isActive) cls += ' rv-cal-day--active';
        if (hasRsv)   cls += ' rv-cal-day--has-rsv';

        html += '<button class="' + cls + '" type="button" data-date="' + key + '">';
        html += '<span class="rv-cal-day-num">' + day + '</span>';

        if (statuses.length) {
          // max 3 dots
          var shown = statuses.slice(0, 3);
          html += '<div class="rv-cal-dots">';
          shown.forEach(function(s) {
            html += '<span class="rv-cal-dot rv-cal-dot--' + s + '"></span>';
          });
          html += '</div>';
        }

        html += '</button>';
      }

      html += '</div>';
      cal.innerHTML = html;

      // Click handlers on day cells
      cal.querySelectorAll('.rv-cal-day').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var date = btn.dataset.date;
          var statuses = dateMap[date] || [];
          if (!statuses.length) return;
          if (activeDateKey === date) {
            activeDateKey = null;
            document.getElementById('rvSelectedDate').hidden = true;
          } else {
            activeDateKey = date;
            showSelectedDate(date);
          }
          buildCalendar();
          applyFilters();
        });
      });
    }

    function showSelectedDate(key) {
      var d = parseDate(key);
      if (!d) return;
      var dateStr = d.getDate() + ' ' + TR_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
      var el = document.getElementById('rvSelectedDate');
      var txt = document.getElementById('rvSelectedDateText');
      if (txt) txt.textContent = '📅 ' + dateStr + ' rezervasyonları';
      if (el) el.hidden = false;
    }

    /* ── Month navigation ── */
    var prevBtn = document.getElementById('rvCalPrev');
    var nextBtn = document.getElementById('rvCalNext');

    if (prevBtn) {
      prevBtn.addEventListener('click', function() {
        calMonth--;
        if (calMonth < 0) { calMonth = 11; calYear--; }
        activeDateKey = null;
        document.getElementById('rvSelectedDate').hidden = true;
        buildCalendar();
        applyFilters();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', function() {
        calMonth++;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        activeDateKey = null;
        document.getElementById('rvSelectedDate').hidden = true;
        buildCalendar();
        applyFilters();
      });
    }

    /* ── Clear date filter ── */
    var clearBtn = document.getElementById('rvClearDate');
    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        activeDateKey = null;
        document.getElementById('rvSelectedDate').hidden = true;
        buildCalendar();
        applyFilters();
      });
    }

    /* ── Status tabs ── */
    document.querySelectorAll('[data-rv-filter]').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('[data-rv-filter]')
          .forEach(function(t){ t.classList.remove('is-active'); });
        tab.classList.add('is-active');
        activeFilter = tab.dataset.rvFilter;
        applyFilters();
      });
    });

    /* ── Apply both filters (status + date) ── */
    function applyFilters() {
      var list = document.getElementById('profileReservationsList');
      if (!list) return;

      var CANCELLED = ['rejected', 'cancelled'];
      var cards = list.querySelectorAll('.reservation-card');
      var visible = 0;

      cards.forEach(function(card) {
        var statusCls = Array.from(card.classList)
          .find(function(c){ return c.startsWith('status-'); });
        var status = statusCls ? statusCls.replace('status-','') : 'pending';

        // Status filter
        var statusOk;
        if (activeFilter === 'all')      statusOk = true;
        else if (activeFilter === 'approved')  statusOk = status === 'approved';
        else if (activeFilter === 'pending')   statusOk = status === 'pending';
        else if (activeFilter === 'rejected')  statusOk = CANCELLED.indexOf(status) !== -1;
        else statusOk = true;

        // Date filter
        var dateOk = true;
        if (activeDateKey) {
          var metaItems = card.querySelectorAll('.reservation-meta-item');
          var dateVal = null;
          metaItems.forEach(function(item) {
            var lbl = item.querySelector('span');
            var val = item.querySelector('strong');
            if (lbl && val && lbl.textContent.trim() === 'Date') {
              dateVal = val.textContent.trim();
            }
          });
          if (dateVal) {
            var d = parseDate(dateVal);
            dateOk = d && toKey(d) === activeDateKey;
          } else {
            dateOk = false;
          }
        }

        var show = statusOk && dateOk;
        card.style.display = show ? '' : 'none';
        if (show) visible++;
      });

      // Empty state
      var existing = list.querySelector('.rv-filter-empty');
      if (visible === 0 && cards.length > 0) {
        if (!existing) {
          var d = document.createElement('div');
          d.className = 'rv-filter-empty';
          d.innerHTML = '<span>Bu kriterlere uygun rezervasyon yok</span>';
          list.appendChild(d);
        }
      } else if (existing) {
        existing.remove();
      }
    }

    /* ── MutationObserver: rebuild when JS renders cards ── */
    var list = document.getElementById('profileReservationsList');
    if (list) {
      var timer;
      new MutationObserver(function() {
        clearTimeout(timer);
        timer = setTimeout(function() {
          var cards = list.querySelectorAll('.reservation-card');
          if (cards.length > 0) {
            var dateMap = extractReservations();
            // Auto-navigate to first reservation month
            autoNavigate(dateMap);
          }
          buildCalendar();
          applyFilters();
        }, 150);
      }).observe(list, { childList: true, subtree: true });
    }

    // Initial calendar render
    buildCalendar();
  })();
  </script>
