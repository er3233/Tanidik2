<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login | TANIDIK</title>

  <meta
    name="description"
    content="Discover premium nightlife venues, events, reservations, and business tools with TANIDIK."
  />

  <meta name="theme-color" content="#050505" />

  <link
    rel="icon"
    href="./assets/favicon.svg"
    type="image/svg+xml"
  />

  <link rel="manifest" href="./manifest.webmanifest" />

  <link rel="apple-touch-icon" href="./assets/icon-192.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TANIDIK" />
  <meta property="og:title" content="TANIDIK | Premium Nightlife Discovery" />
  <meta
    property="og:description"
    content="Discover premium nightlife venues, events, reservations, and business tools with TANIDIK."
  />
  <meta property="og:url" content="https://tanidik2.vercel.app" />
  <meta property="og:image" content="https://tanidik2.vercel.app/assets/social-preview.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TANIDIK | Premium Nightlife Discovery" />
  <meta
    name="twitter:description"
    content="Discover premium nightlife venues, events, reservations, and business tools with TANIDIK."
  />
  <meta name="twitter:image" content="https://tanidik2.vercel.app/assets/social-preview.png" />

  <link
    rel="stylesheet"
    href="./css/style.css"
  />
</head>

<body class="auth-page">

  <main class="auth-container">

    <section class="auth-hero" aria-label="TANIDIK login">
      <span class="auth-kicker">
        Premium Nightlife
      </span>

      <h1>
        TANIDIK
      </h1>

      <p>
        Discover places, book experiences, and connect with businesses.
      </p>
    </section>

    <section class="auth-stage" aria-label="Account access">
      <div class="auth-tentacles" aria-hidden="true">
        <span class="auth-tentacle auth-tentacle--left auth-tentacle--one"></span>
        <span class="auth-tentacle auth-tentacle--left auth-tentacle--two"></span>
        <span class="auth-tentacle auth-tentacle--left auth-tentacle--three"></span>
        <span class="auth-tentacle auth-tentacle--left auth-tentacle--four"></span>
        <span class="auth-tentacle auth-tentacle--right auth-tentacle--five"></span>
        <span class="auth-tentacle auth-tentacle--right auth-tentacle--six"></span>
        <span class="auth-tentacle auth-tentacle--right auth-tentacle--seven"></span>
        <span class="auth-tentacle auth-tentacle--right auth-tentacle--eight"></span>
      </div>

      <div class="auth-card">
        <div class="auth-tab-header" aria-label="Login or sign up">
          <span class="auth-tab auth-tab--active">
            Login
          </span>

          <span class="auth-tab">
            Sign Up
          </span>
        </div>

        <div class="auth-card-header">
          <h2>
            Welcome
          </h2>

          <p>
            Login or create your account to continue.
          </p>
        </div>

        <div class="auth-fields">
          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            inputmode="email"
          />

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
        </div>

        <p
          id="authMessage"
          class="auth-message"
          role="status"
          aria-live="polite"
        >
        </p>

        <div class="auth-actions" aria-label="Login or register">
          <button id="loginBtn" type="button">
            Login
          </button>

          <button id="registerBtn" type="button">
            Register
          </button>
        </div>

        <p class="auth-helper">
          Private access for reservations, venues, and business messages.
        </p>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="./js/app.js"></script>

  <div id="toast" class="toast"></div>

</body>
</html>
