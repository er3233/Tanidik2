<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restoran Paneli | TANIDIK</title>
  <meta name="theme-color" content="#050608" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/courier-dispatch.css" />
  <link rel="stylesheet" href="./css/design-system.css" />
<link rel="stylesheet" href="./css/bottom-nav.css" />
</head>

<body>

  <!-- ── Top Bar ─────────────────────────────────────────── -->
  <header class="ds-top-bar">
    <a href="./business.html" class="ds-top-bar__back" aria-label="Geri">‹</a>
    <span class="ds-top-bar__title" id="restaurantPanelTitle">Restoran Paneli</span>
    <div style="width:40px;"></div>
  </header>

  <!-- ── Main ───────────────────────────────────────────── -->
  <main id="restaurantOrdersPage" class="business-page order-page ds-scroll-content">

    <!-- Restaurant Header -->
    <div class="ds-restaurant-hdr">
      <div class="ds-avatar-wrap ds-avatar-wrap--ring" style="margin-bottom:8px;">
        <div class="ds-avatar ds-avatar--lg" id="restaurantPanelAvatar" aria-hidden="true">🍽</div>
      </div>
      <p class="ds-restaurant-hdr__name" id="restaurantPanelName">Restoran Paneli</p>
      <a href="./business.html" class="ds-restaurant-hdr__link">İşletme Paneline Git ›</a>
    </div>

    <!-- Live Badge -->
    <div style="display:flex;justify-content:center;margin-bottom:12px;">
      <span id="restaurantOrdersLiveBadge" class="fulfillment-live-badge" hidden aria-live="polite">Bağlanıyor…</span>
    </div>

    <!-- Stats Strip -->
    <div class="ds-stat-strip" id="restaurantStatsStrip">
      <div class="ds-stat-cell">
        <span class="ds-stat-cell__value" id="restaurantStatOrders">—</span>
        <span class="ds-stat-cell__label">Sipariş</span>
      </div>
      <div class="ds-stat-cell">
        <span class="ds-stat-cell__value" id="restaurantStatRevenue">—</span>
        <span class="ds-stat-cell__label">Gelir</span>
      </div>
      <div class="ds-stat-cell">
        <span class="ds-stat-cell__value" id="restaurantStatRating">—</span>
        <span class="ds-stat-cell__label">Puan</span>
      </div>
    </div>

    <!-- Orders Section -->
    <section class="dashboard-section" style="padding-bottom:8px;">
      <div class="ds-section-hdr">
        <span class="ds-section-hdr__title">Siparişler</span>
        <span class="ds-section-hdr__link" style="cursor:default;font-size:0.72rem;opacity:0.6;" id="restaurantOrdersCount"></span>
      </div>

      <div style="padding:0 16px 8px;display:flex;align-items:center;gap:10px;">
        <label style="font-size:0.75rem;color:rgba(255,255,255,0.5);white-space:nowrap;" for="restaurantOrdersVenueFilter">Mekan:</label>
        <select id="restaurantOrdersVenueFilter" class="order-select" style="flex:1;"></select>
      </div>

      <div style="padding:0 16px;">
        <div class="ds-card">
          <div id="restaurantOrdersList" class="order-list" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <div class="ds-spacer-lg"></div>
  </main>

  <!-- ── Bottom Navigation ───────────────────────────────── -->
  <nav class="bnav mobile-bottom-nav" aria-label="Ana navigasyon">
  <a href="./index.html" class="bnav-item" data-nav-page="index.html">
    <span class="bnav-icon-wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1z"/><path d="M9 21V12h6v9"/></svg></span>
    <span class="bnav-label">Ana Sayfa</span>
  </a>
  <a href="./discover.html" class="bnav-item" data-nav-page="discover.html">
    <span class="bnav-icon-wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    <span class="bnav-label">Keşfet</span>
  </a>
  <a href="./store.html" class="bnav-item" data-nav-page="store.html">
    <span class="bnav-icon-wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></span>
    <span class="bnav-label">Mağaza</span>
  </a>
  <a href="./food.html" class="bnav-item" data-nav-page="food.html">
    <span class="bnav-icon-wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></span>
    <span class="bnav-label">Yemek</span>
  </a>
  <a href="./messages.html" class="bnav-item" data-nav-page="messages.html">
    <span class="bnav-icon-wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span>
    <span class="bnav-label">Mesajlar</span>
  </a>
  <a href="./profile.html" class="bnav-item" data-nav-page="profile.html">
    <span class="bnav-icon-wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
    <span class="bnav-label">Profil</span>
  </a>
</nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="./js/app.js"></script>
  <div id="toast" class="toast"></div>
</body>

</html>
