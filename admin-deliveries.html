<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teslimat Yönetimi | TANIDIK</title>
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/courier-dispatch.css" />
  <link rel="stylesheet" href="./css/courier-operations.css" />
</head>

<body>
  <nav class="navbar">
    <h1>TANIDIK</h1>
    <div class="nav-links">
      <a href="./admin.html">Admin Panel</a>
      <a href="./admin-couriers.html">Kuryeler</a>
    </div>
  </nav>

  <main id="adminDeliveriesPage" class="admin-page order-page">
    <header class="dashboard-header dashboard-header--admin">
      <h1>Teslimat Yönetimi</h1>
      <p class="page-message">Delivery siparişlerini görün ve kurye atayın.</p>
      <a href="./admin.html" class="secondary-btn">← Admin Panel</a>
      <button type="button" id="adminDeliveriesRefreshBtn" class="secondary-btn">Yenile</button>
      <span id="adminDeliveriesLiveBadge" class="fulfillment-live-badge" hidden aria-live="polite">Bağlanıyor…</span>
    </header>

    <nav class="admin-delivery-tabs dashboard-section" role="tablist" aria-label="Teslimat sekmeleri">
      <button type="button" class="admin-delivery-tab is-active" data-admin-delivery-tab="pool" role="tab">Bekleyen Teslimatlar</button>
      <button type="button" class="admin-delivery-tab" data-admin-delivery-tab="active" role="tab">Aktif Teslimatlar</button>
      <button type="button" class="admin-delivery-tab" data-admin-delivery-tab="completed" role="tab">Tamamlanan Teslimatlar</button>
    </nav>

    <section class="admin-section dashboard-section admin-delivery-tab-panel" data-admin-delivery-panel="pool">
      <div id="adminDeliveryPoolList" class="admin-list" aria-live="polite"></div>
    </section>

    <section class="admin-section dashboard-section admin-delivery-tab-panel" data-admin-delivery-panel="active" hidden>
      <div id="adminDeliveryActiveList" class="admin-list" aria-live="polite"></div>
    </section>

    <section class="admin-section dashboard-section admin-delivery-tab-panel" data-admin-delivery-panel="completed" hidden>
      <div id="adminDeliveryCompletedList" class="admin-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="./js/app.js"></script>
  <div id="toast" class="toast"></div>
</body>

</html>
