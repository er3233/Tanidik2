<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesajlar | TANIDIK</title>
  <meta name="description" content="TANIDIK direkt mesajlar ve konuşmalar." />

<body class="msg-body">

  <main class="messages-page msg-page">
    <section class="messages-layout msg-layout">

      <!-- ══════════════════════════════════════
           INBOX PANEL
      ══════════════════════════════════════ -->
      <aside class="messages-inbox msg-inbox">

        <!-- Topbar -->
        <div class="msg-topbar">
          <h1 class="msg-topbar-title">Mesajlar</h1>
          <button
            id="newMessageBtn"
            type="button"
            class="msg-topbar-btn new-message-btn"
            aria-expanded="false"
            aria-controls="userSearchPanel"
            aria-label="Yeni mesaj"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>

        <!-- Search bar -->
        <div class="msg-search-wrap">
          <svg class="msg-search-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="search" class="msg-search-input" placeholder="Konuşma ara..." autocomplete="off" />
        </div>

        <!-- New message user search (JS controlled) -->
        <div id="userSearchPanel" class="user-search-panel msg-user-search" hidden>
          <div class="msg-user-search-inner">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
              id="userSearchInput"
              type="search"
              placeholder="Kullanıcı adı ara…"
              autocomplete="off"
              class="msg-user-search-input"
            />
          </div>
          <div id="userSearchResults" class="user-search-results msg-user-results"></div>
        </div>

        <!-- Refresh (gizli, JS kullanıyor) -->
        <button
          id="messagesRefreshBtn"
          type="button"
          class="msg-refresh-btn secondary-btn message-refresh-btn"
          aria-label="Yenile"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
          </svg>
        </button>

        <!-- Thread list -->
        <div id="messagesList" class="messages-list msg-threads"></div>

      </aside>

      <!-- ══════════════════════════════════════
           CONVERSATION PANEL
      ══════════════════════════════════════ -->
      <section id="conversationPanel" class="conversation-panel msg-chat">

        <!-- Chat header -->
        <div class="msg-chat-header">
          <button type="button" class="conversation-back-btn msg-back-btn" aria-label="Gelen kutusu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
          </button>
          <div id="conversationContextHeader" class="conversation-context-header msg-chat-info" aria-live="polite"></div>
          <button type="button" class="msg-chat-opts" aria-label="Seçenekler">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/>
            </svg>
          </button>
        </div>

        <!-- Empty / welcome state -->
        <div id="conversationHeader" class="conversation-header msg-empty">
          <div class="msg-empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(201,162,39,0.55)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
          </div>
          <h2 class="msg-empty-title">Mesajlarınız</h2>
          <p class="msg-empty-sub">Gelen kutunuzdan bir konuşma seçin veya yeni mesaj başlatın.</p>
        </div>

        <!-- Messages scrollable area -->
        <div id="conversationMessages" class="conversation-messages msg-messages"></div>

        <!-- Typing indicator -->
        <div id="conversationTypingIndicator" class="conversation-typing-indicator msg-typing" aria-live="polite"></div>

        <!-- AI Concierge quick prompts -->
        <div id="aiConciergeQuickPrompts" class="ai-concierge-quick-prompts msg-ai-prompts" hidden>
          <span class="ai-concierge-quick-prompts__label msg-ai-label">✦ Hızlı öneri</span>
          <div class="ai-concierge-quick-prompts__buttons msg-ai-chips">
            <button type="button" class="secondary-btn msg-ai-chip" data-ai-prompt="Canlı müzik">🎵 Canlı müzik</button>
            <button type="button" class="secondary-btn msg-ai-chip" data-ai-prompt="Date mekanı">💑 Date mekanı</button>
            <button type="button" class="secondary-btn msg-ai-chip" data-ai-prompt="After party">🎉 After party</button>
            <button type="button" class="secondary-btn msg-ai-chip" data-ai-prompt="Sakin cafe">☕ Sakin cafe</button>
          </div>
        </div>

        <!-- Compose form -->
        <form id="messageForm" class="message-form msg-compose">
          <div class="message-composer-main msg-compose-row">
            <label
              class="message-attach-control msg-attach-btn"
              for="messageAttachmentImage"
              aria-label="Dosya ekle"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
              </svg>
            </label>
            <input
              id="messageAttachmentImage"
              class="message-attachment-input"
              type="file"
              accept="image/*"
            />
            <textarea
              id="messageBody"
              class="msg-textarea"
              maxlength="1000"
              placeholder="Mesaj yaz…"
              rows="1"
            ></textarea>
            <button type="submit" class="btn msg-send-btn" aria-label="Gönder">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </form>

      </section>

    </section>
  </main>

    <a href="./store.html" class="bnav-item" data-nav-page="store.html">
      <span class="bnav-icon-wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></span>
      <span class="bnav-label">Mağaza</span>

    <a href="./food.html" class="bnav-item" data-nav-page="food.html">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- Mobile panel toggle (değiştirilmedi) -->
  <script>
  (function () {
    var layout  = document.querySelector('.messages-layout');
    var list    = document.getElementById('messagesList');
    var backBtn = document.querySelector('.conversation-back-btn');
    if (!layout) return;

    function isMobile() { return window.innerWidth < 769; }

    if (isMobile() && /[?&]conversation=/.test(window.location.search)) {
      layout.classList.add('chat-active');
    }

    var panel = document.getElementById('conversationPanel');
    if (panel && window.MutationObserver) {
      new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
          if (m.attributeName === 'data-conversation-id' && panel.dataset.conversationId) {
            if (isMobile()) layout.classList.add('chat-active');
          }
        });
      }).observe(panel, { attributes: true });
    }

    if (list) {
      list.addEventListener('click', function (e) {
        if (isMobile() && e.target.closest('.message-thread')) {
          layout.classList.add('chat-active');
        }
      });
    }

    if (backBtn) {
      backBtn.addEventListener('click', function () {
        layout.classList.remove('chat-active');
      });
    }

    /* Textarea auto-resize */
    var ta = document.getElementById('messageBody');
    if (ta) {
      ta.addEventListener('input', function () {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
      });
    }
  })();
  </script>

  <div id="toast" class="toast"></div>

</body>
