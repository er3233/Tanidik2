  <main class="messages-page">

    <section class="messages-layout">

      <aside class="messages-inbox dashboard-section">
        <div class="messages-panel-header">
          <div class="messages-header-actions">
            <button
              id="newMessageBtn"
              type="button"
              class="btn new-message-btn"
              aria-expanded="false"
              aria-controls="userSearchPanel"
            >
              New Message
            </button>

            <button
              id="messagesRefreshBtn"
              type="button"
              class="secondary-btn message-refresh-btn"
            >
              Refresh
            </button>
          </div>
        </div>

        <div
          id="userSearchPanel"
          class="user-search-panel"
          hidden
        >
          <input
            id="userSearchInput"
            type="search"
            placeholder="Search users..."
            autocomplete="off"
          />

          <div
            id="userSearchResults"
            class="user-search-results"
          >
          </div>
        </div>

        <div
          id="messagesList"
          class="messages-list"
        >
        </div>
      </aside>

      <section
        id="conversationPanel"
        class="conversation-panel dashboard-section"
      >
        <button type="button" class="conversation-back-btn" aria-label="Back to inbox">
          ‹ Inbox
        </button>

        <div
          id="conversationHeader"
          class="conversation-header"
        >
          <span class="messages-kicker">
            Message Thread
          </span>

          <h2>
            Conversation
          </h2>

          <p>
            Choose a direct message or reservation conversation from your inbox.
          </p>
        </div>

        <div
          id="conversationContextHeader"
          class="conversation-context-header"
          aria-live="polite"
        >
        </div>

        <div
          id="conversationMessages"
          class="conversation-messages"
        >
        </div>

        <div
          id="conversationTypingIndicator"
          class="conversation-typing-indicator"
          aria-live="polite"
        >
        </div>

        <div
          id="aiConciergeQuickPrompts"
          class="ai-concierge-quick-prompts"
          hidden
        >
          <span class="ai-concierge-quick-prompts__label">Hızlı öneri</span>
          <div class="ai-concierge-quick-prompts__buttons">
            <button type="button" class="secondary-btn" data-ai-prompt="Canlı müzik">
              Canlı müzik
            </button>
            <button type="button" class="secondary-btn" data-ai-prompt="Date mekanı">
              Date mekanı
            </button>
            <button type="button" class="secondary-btn" data-ai-prompt="After party">
              After party
            </button>
            <button type="button" class="secondary-btn" data-ai-prompt="Sakin cafe">
              Sakin cafe
            </button>
          </div>
        </div>

        <form
          id="messageForm"
          class="message-form"
        >
          <div class="message-composer-main">
            <textarea
              id="messageBody"
              maxlength="1000"
              placeholder="Write a reservation message..."
            ></textarea>

            <label
              class="message-attach-control"
              for="messageAttachmentImage"
            >
              <span aria-hidden="true">+</span>
              Image
            </label>

            <input
              id="messageAttachmentImage"
              class="message-attachment-input"
              type="file"
              accept="image/*"
            />
          </div>

          <button
            type="submit"
            class="btn"
          >
            Send
          </button>
        </form>
      </section>

  <script>
  (function () {
    var layout  = document.querySelector('.messages-layout');
    var list    = document.getElementById('messagesList');
    var backBtn = document.querySelector('.conversation-back-btn');
    if (!layout) return;

    function isMobile() { return window.innerWidth < 769; }

    // Fast path: if URL already has ?conversation= on page load, show panel immediately
    if (isMobile() && /[?&]conversation=/.test(window.location.search)) {
      layout.classList.add('chat-active');
    }

    // Reliable path: watch panel's data-conversation-id attribute — fires for both
    // full-page navigation (loadConversation on page load) and SPA pushState navigation
    var panel = document.getElementById('conversationPanel');
    if (panel && window.MutationObserver) {
      new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
          if (m.attributeName === 'data-conversation-id' && panel.dataset.conversationId) {
            if (isMobile()) layout.classList.add('chat-active');
          }
        });
      }).observe(panel, { attributes: true });
    }

    // Instant visual feedback: adds chat-active on thread click before navigation fires
    if (list) {
      list.addEventListener('click', function (e) {
        if (isMobile() && e.target.closest('.message-thread')) {
          layout.classList.add('chat-active');
        }
      });
    }

    if (backBtn) {
      backBtn.addEventListener('click', function () {
        layout.classList.remove('chat-active');
      });
    }
  })();
  </script>
