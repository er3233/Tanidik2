<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Messages | TANIDIK</title>

  <meta
    name="description"
    content="Discover premium nightlife venues, events, reservations, and business tools with TANIDIK."
  />

  <meta name="theme-color" content="#050505" />

  <link
    rel="icon"
    href="./assets/favicon.svg"
    type="image/svg+xml"
  />

  <link rel="manifest" href="./manifest.webmanifest" />

  <link rel="apple-touch-icon" href="./assets/icon-192.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TANIDIK" />
  <meta property="og:title" content="TANIDIK | Premium Nightlife Discovery" />
  <meta
    property="og:description"
    content="Discover premium nightlife venues, events, reservations, and business tools with TANIDIK."
  />
  <meta property="og:url" content="https://tanidik2.vercel.app" />
  <meta property="og:image" content="https://tanidik2.vercel.app/assets/social-preview.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TANIDIK | Premium Nightlife Discovery" />
  <meta
    name="twitter:description"
    content="Discover premium nightlife venues, events, reservations, and business tools with TANIDIK."
  />
  <meta name="twitter:image" content="https://tanidik2.vercel.app/assets/social-preview.png" />

  <link
    rel="stylesheet"
    href="./css/style.css"
  />
</head>

<body>

  <nav class="navbar">

    <h1>TANIDIK</h1>

    <button
      class="nav-toggle"
      type="button"
      aria-label="Toggle navigation"
      aria-expanded="false"
    >
      Menu
    </button>

    <div class="nav-links">

      <a href="./index.html">Home</a>

      <a href="./discover.html">Discover</a>

      <a href="./events.html">Events</a>

      <a href="./favorites.html">Favorites</a>

      <a
        href="./auth.html"
        id="authLink"
      >
        Login
      </a>

    </div>

  </nav>

  <main class="messages-page">

    <header class="dashboard-header dashboard-header--messages">
      <h1>
        Messages
      </h1>

      <p class="page-message">
        Reservation conversations with guests and businesses.
      </p>
    </header>

    <section class="messages-layout">

      <aside class="messages-inbox dashboard-section">
        <div class="messages-panel-header">
          <div>
            <span class="messages-kicker">
              Reservation Inbox
            </span>

            <h2>
              Inbox
            </h2>
          </div>

          <button
            id="messagesRefreshBtn"
            type="button"
            class="secondary-btn message-refresh-btn"
          >
            Refresh
          </button>
        </div>

        <div
          id="messagesList"
          class="messages-list"
        >
        </div>
      </aside>

      <section
        id="conversationPanel"
        class="conversation-panel dashboard-section"
      >
        <div
          id="conversationHeader"
          class="conversation-header"
        >
          <span class="messages-kicker">
            Reservation Thread
          </span>

          <h2>
            Conversation
          </h2>

          <p>
            Choose a reservation conversation from your inbox.
          </p>
        </div>

        <div
          id="conversationMessages"
          class="conversation-messages"
        >
        </div>

        <form
          id="messageForm"
          class="message-form"
        >
          <textarea
            id="messageBody"
            maxlength="1000"
            placeholder="Write a reservation message..."
            required
          ></textarea>

          <button
            type="submit"
            class="btn"
          >
            Send
          </button>
        </form>
      </section>

    </section>

  </main>

  <nav
    class="mobile-bottom-nav"
    aria-label="Primary mobile navigation"
  >
    <a href="./discover.html" data-nav-page="discover.html"><span aria-hidden="true">D</span>Discover</a>
    <a href="./events.html" data-nav-page="events.html"><span aria-hidden="true">E</span>Events</a>
    <a href="./profile.html" data-nav-page="profile.html"><span aria-hidden="true">R</span>Profile</a>
    <a href="./messages.html" data-nav-page="messages.html"><span aria-hidden="true">M</span>Messages</a>
    <a href="./business.html" data-nav-page="business.html"><span aria-hidden="true">B</span>Business</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="./js/app.js"></script>

  <div id="toast" class="toast"></div>

</body>
</html>
