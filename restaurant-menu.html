<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restoran Menüsü | TANIDIK</title>
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <nav class="navbar">
    <h1>TANIDIK</h1>
    <button class="nav-toggle" type="button" aria-label="Menü" aria-expanded="false">Menü</button>
    <div class="nav-links">
      <a href="./discover.html">Keşfet</a>
      <a href="./business.html" id="restaurantMenuBusinessLink" hidden>İşletme</a>
      <a href="./profile.html" id="authLink">Profil</a>
    </div>
  </nav>

  <main id="restaurantMenuPage" class="order-page">
    <header class="dashboard-header">
      <span class="dashboard-kicker" id="restaurantMenuKicker">Menü</span>
      <h1 id="restaurantMenuTitle">Restoran Menüsü</h1>
      <p class="page-message" id="restaurantMenuSubtitle"></p>
    </header>

    <!-- İşletme: menü yönetimi -->
    <section id="restaurantMenuManageSection" class="dashboard-section" hidden>
      <a href="./business.html" class="secondary-btn">← İşletme Paneli</a>
      <label class="order-filter-label" for="restaurantMenuVenueSelect">Mekan</label>
      <select id="restaurantMenuVenueSelect" class="order-select"></select>

      <form id="restaurantMenuItemForm" class="admin-form order-menu-form">
        <input type="hidden" id="restaurantMenuItemId" />
        <input type="text" id="restaurantMenuItemName" placeholder="Ürün adı" required />
        <input type="text" id="restaurantMenuItemCategory" placeholder="Kategori (opsiyonel)" />
        <input type="number" id="restaurantMenuItemPrice" placeholder="Fiyat (₺)" min="0" step="0.01" required />
        <textarea id="restaurantMenuItemDescription" placeholder="Açıklama"></textarea>
        <input type="url" id="restaurantMenuItemImage" placeholder="Görsel URL (opsiyonel)" />
        <label class="order-checkbox-label">
          <input type="checkbox" id="restaurantMenuItemAvailable" checked />
          Satışta
        </label>
        <div class="admin-form-actions">
          <button type="submit" class="btn">Kaydet</button>
          <button type="button" id="restaurantMenuItemClearBtn" class="secondary-btn">Temizle</button>
        </div>
      </form>

      <div id="restaurantMenuManageList" class="order-menu-grid"></div>
    </section>

    <!-- Müşteri: sipariş -->
    <section id="restaurantMenuOrderSection" class="dashboard-section" hidden>
      <div id="restaurantMenuItemsList" class="order-menu-grid"></div>

      <aside class="order-cart-panel" id="restaurantOrderCart">
        <h2>Sepet</h2>
        <div id="restaurantOrderCartItems" class="order-cart-items"></div>
        <p class="order-cart-total">Toplam: <strong id="restaurantOrderCartTotal">₺0</strong></p>

        <fieldset class="order-type-fieldset">
          <legend>Sipariş tipi</legend>
          <label><input type="radio" name="orderType" value="pickup" checked /> Gel-al</label>
          <label><input type="radio" name="orderType" value="delivery" /> Teslimat</label>
        </fieldset>

        <textarea id="restaurantOrderDeliveryAddress" class="order-address-input" placeholder="Teslimat adresi" hidden></textarea>
        <textarea id="restaurantOrderNote" placeholder="Sipariş notu (opsiyonel)"></textarea>
        <button type="button" id="restaurantOrderSubmitBtn" class="btn">Sipariş Ver</button>
      </aside>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="./js/app.js"></script>
  <div id="toast" class="toast"></div>
</body>

</html>
