<body class="food-page-body">

  <main id="foodPage" class="food-page">

      </div>
      <button class="food-filter-btn" id="foodFilterOpenBtn" type="button" aria-label="Filtrele" aria-haspopup="dialog">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
          <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
          <line x1="1" y1="14" x2="7" y2="14"/>
          <line x1="9" y1="8" x2="15" y2="8"/>
          <line x1="17" y1="16" x2="23" y2="16"/>
        </svg>
      </button>
    </div>

    <!-- ── Category icons (yemek kategorileri) ─── -->
    <div class="food-cats-wrap" aria-label="Yemek kategorileri">
      <div class="food-cats" role="list">
        <button class="food-cat is-active" type="button" role="listitem" data-cat="">

          <span class="food-cat__lbl">Tümü</span>
        </button>
        <button class="food-cat" type="button" role="listitem" data-cat="döner">
          <span class="food-cat__ico">🥙</span>
          <span class="food-cat__lbl">Döner</span>
        </button>
        <button class="food-cat" type="button" role="listitem" data-cat="pizza">
          <span class="food-cat__ico">🍕</span>
          <span class="food-cat__lbl">Pizza</span>
        </button>
        <button class="food-cat" type="button" role="listitem" data-cat="burger">
          <span class="food-cat__ico">🍔</span>
          <span class="food-cat__lbl">Burger</span>
        </button>
        <button class="food-cat" type="button" role="listitem" data-cat="kebap">

          <span class="food-cat__lbl">Kebap</span>
        </button>
        <button class="food-cat" type="button" role="listitem" data-cat="tavuk">
          <span class="food-cat__ico">🍗</span>
          <span class="food-cat__lbl">Tavuk</span>
        </button>
        <button class="food-cat" type="button" role="listitem" data-cat="tatlı">

    </div>

    <!-- #foodCuisineFilters gizli (JS uyumluluğu için DOM'da tutulur) -->
    <div class="food-chips-hidden" aria-hidden="true">

    <!-- ── Campaign carousel ─────────────────────── -->
    <section class="food-campaign" id="foodCampaignSection" hidden>

  <!-- ════ Filter Modal (bottom sheet) ════ -->

    <div class="food-fmodal__sheet">

      <!-- Header -->
      <div class="food-fmodal__header">
        <h2 class="food-fmodal__title">Filtrele</h2>
        <button class="food-fmodal__close" id="foodFilterClose" type="button" aria-label="Kapat">

            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Kategoriler -->
      <div class="food-fmodal__section">
        <h3 class="food-fmodal__section-title">Kategoriler</h3>
        <div class="food-fmodal__chips">
          <button class="food-fchip is-active" type="button">Tümü</button>
          <button class="food-fchip" type="button">Pizza</button>
          <button class="food-fchip" type="button">Burger</button>
          <button class="food-fchip" type="button">Döner</button>
          <button class="food-fchip" type="button">Sushi</button>
          <button class="food-fchip" type="button">Kebap</button>
          <button class="food-fchip" type="button">Tavuk</button>
          <button class="food-fchip" type="button">Tatlı</button>
          <button class="food-fchip" type="button">Kahve</button>
          <button class="food-fchip" type="button">Diğer</button>
        </div>
      </div>

      <!-- Sipariş Tipi — JS tarafından doldurulur -->
      <div class="food-fmodal__section">
        <h3 class="food-fmodal__section-title">Sipariş Tipi</h3>
        <div class="food-fmodal__chip-group food-chip-group" id="foodOrderTypeFilters" role="group"></div>
      </div>

      <!-- Durum — JS tarafından doldurulur -->
      <div class="food-fmodal__section">
        <h3 class="food-fmodal__section-title">Durum</h3>
        <div class="food-fmodal__chip-group food-chip-group" id="foodStatusFilters" role="group"></div>
      </div>

      <!-- Sıralama — statik -->
      <div class="food-fmodal__section">
        <h3 class="food-fmodal__section-title">Sıralama</h3>
        <div class="food-fmodal__chips">
          <button class="food-fchip is-active" type="button">Önerilen</button>
          <button class="food-fchip" type="button">En yakın</button>
          <button class="food-fchip" type="button">En hızlı</button>
          <button class="food-fchip" type="button">En yüksek puan</button>
        </div>
      </div>

      <!-- Uygula -->
      <div class="food-fmodal__footer">
        <button class="food-fmodal__apply" id="foodFilterApply" type="button">Uygula</button>
      </div>

    </div>
  </div>
  <!-- ════════════════════════════════════════ -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="./js/app.js"></script>
  <div id="toast" class="toast"></div>

  <!-- Modal aç/kapat — sadece UI -->
  <script>
  (function () {
    var modal = document.getElementById('foodFilterModal');
    var openBtn = document.getElementById('foodFilterOpenBtn');
    var closeBtn = document.getElementById('foodFilterClose');
    var backdrop = document.getElementById('foodFilterBackdrop');
    var applyBtn = document.getElementById('foodFilterApply');

    function open() {
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }
    function close() {
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    if (openBtn) openBtn.addEventListener('click', open);
    if (closeBtn) closeBtn.addEventListener('click', close);
    if (backdrop) backdrop.addEventListener('click', close);
    if (applyBtn) applyBtn.addEventListener('click', close);

    /* Chip toggle — kategoriler + sıralama bölümleri */
    modal.querySelectorAll('.food-fmodal__chips').forEach(function (group) {
      group.addEventListener('click', function (e) {
        var chip = e.target.closest('.food-fchip');
        if (!chip) return;
        group.querySelectorAll('.food-fchip').forEach(function (c) { c.classList.remove('is-active'); });
        chip.classList.add('is-active');
      });
    });

    /* Kategori ikonu toggle + cuisine chip bağlantısı */
    var catWrap = document.querySelector('.food-cats');
    if (catWrap) {
      catWrap.addEventListener('click', function (e) {
        var btn = e.target.closest('.food-cat');
        if (!btn) return;
        catWrap.querySelectorAll('.food-cat').forEach(function (c) { c.classList.remove('is-active'); });
        btn.classList.add('is-active');
        var lbl = btn.querySelector('.food-cat__lbl');
        var catText = lbl ? lbl.textContent.trim().toLowerCase() : '';
        var chips = document.querySelectorAll('#foodCuisineFilters .food-chip');
        if (!catText || catText === 'tümü') {
          var allChip = Array.from(chips).find(function(c){ return c.textContent.trim().toLowerCase() === 'tümü'; });
          if (allChip) allChip.click();
          return;
        }
        var match = Array.from(chips).find(function(c){
          var t = c.textContent.trim().toLowerCase();
          return t === catText || t.includes(catText) || catText.includes(t);
        });
        if (match) match.click();
      });
    }
  })();
  </script>
