<body class="food-page-body">
  <nav class="navbar">
    <h1>TANIDIK</h1>

      <a href="./food.html" data-nav-page="food.html">← Yemek</a>

      <a href="./orders.html">Siparişlerim</a>
      <a href="./auth.html" id="authLink">Giriş</a>
    </div>
  </nav>

  <main id="foodVenuePage" class="food-venue-page order-page">
    <div id="foodVenueHero" class="food-venue-hero" hidden>
      <div class="food-venue-hero__media">
        <img id="foodVenueCover" class="food-venue-hero__cover" alt="" />
        <div class="food-venue-hero__overlay"></div>
      </div>
      <div class="food-venue-hero__content">
        <span class="food-venue-hero__status" id="foodVenueOpenBadge"></span>
        <h1 id="foodVenueName" class="food-venue-hero__title"></h1>
        <p id="foodVenueMeta" class="food-venue-hero__meta"></p>
        <div id="foodVenueChips" class="food-venue-chips"></div>
      </div>
    </div>

    <section class="food-venue-layout dashboard-section">
      <div class="food-venue-menu-col">
        <div id="foodMenuCategoryTabs" class="food-menu-tabs" role="tablist"></div>
        <div id="restaurantMenuItemsList" class="food-menu-grid"></div>
      </div>

      <aside class="order-cart-panel food-cart-panel" id="restaurantOrderCart">
        <h2>Sepet</h2>
        <div id="restaurantOrderCartItems" class="order-cart-items"></div>
        <p class="order-cart-total">Toplam: <strong id="restaurantOrderCartTotal">₺0</strong></p>

        <fieldset class="order-type-fieldset">
          <legend>Sipariş tipi</legend>
          <label><input type="radio" name="orderType" value="pickup" checked /> Gel-al</label>
          <label><input type="radio" name="orderType" value="delivery" /> Teslimat</label>
        </fieldset>

        <textarea id="restaurantOrderDeliveryAddress" class="order-address-input" placeholder="Teslimat adresi" hidden></textarea>
        <textarea id="restaurantOrderNote" placeholder="Sipariş notu (opsiyonel)"></textarea>
        <button type="button" id="restaurantOrderSubmitBtn" class="btn">Sipariş Ver</button>
      </aside>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="./js/app.js"></script>
