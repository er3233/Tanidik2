  <!-- Status filter tabs — küçük UI script -->
  <script>
  (function () {
    var ACTIVE = ['pending','new','accepted','preparing','ready_for_pickup','courier_assigned','picked_up','on_the_way','out_for_delivery'];
    var DONE   = ['delivered'];
    var CANCEL = ['rejected','cancelled'];

    function getStatus(card) {
      var badge = card.querySelector('.status-badge');
      if (!badge) return 'unknown';
      var cls = Array.from(badge.classList).find(function(c){ return c.startsWith('status-'); });
      return cls ? cls.replace('status-', '') : 'unknown';
    }

    function applyFilter(type) {
      var tabs  = document.querySelectorAll('[data-order-filter]');
      var list  = document.getElementById('userOrdersList');
      if (!list) return;

      tabs.forEach(function(t){ t.classList.remove('is-active'); });
      var active = document.querySelector('[data-order-filter="' + type + '"]');
      if (active) active.classList.add('is-active');

      var cards   = list.querySelectorAll('.order-card');
      var visible = 0;
      cards.forEach(function(card) {
        var s = getStatus(card);
        var show;
        if (type === 'all')       show = true;
        else if (type === 'active')    show = ACTIVE.indexOf(s) !== -1;
        else if (type === 'done')      show = DONE.indexOf(s) !== -1;
        else if (type === 'cancelled') show = CANCEL.indexOf(s) !== -1;
        else show = true;
        card.style.display = show ? '' : 'none';
        if (show) visible++;
      });

      var existing = list.querySelector('.ord-filter-empty');
      if (visible === 0 && cards.length > 0) {
        if (!existing) {
          var d = document.createElement('div');
          d.className = 'ord-filter-empty';
          d.innerHTML = '<span>Bu kategoride sipariş yok</span>';
          list.appendChild(d);
        }
      } else if (existing) {
        existing.remove();
      }
    }

    /* Tab click */
    document.querySelectorAll('[data-order-filter]').forEach(function(tab) {
      tab.addEventListener('click', function(){ applyFilter(tab.dataset.orderFilter); });
    });

    /* Re-apply when JS renders orders */
    var list = document.getElementById('userOrdersList');
    if (list) {
      new MutationObserver(function() {
        var activeTab = document.querySelector('[data-order-filter].is-active');
        if (activeTab) applyFilter(activeTab.dataset.orderFilter);
      }).observe(list, { childList: true });
    }
  })();
  </script>

  <div id="toast" class="toast"></div>
