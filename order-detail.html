<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body class="od-body">

  <main id="orderDetailPage" class="od-page order-page profile-dashboard">

    <!-- ── Topbar ─────────────────────────────────── -->
    <div class="od-topbar">
      <a href="./orders.html" class="od-back-btn profile-back-link" aria-label="Siparişlerime dön">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </a>
      <h1 id="orderDetailTitle" class="od-topbar-title">Sipariş Detayı</h1>
      <div class="od-topbar-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>
    </div>

    <div class="od-body-wrap">

      <!-- ── Order card + address/note (JS renders here) ── -->
      <div id="orderDetailContent" class="order-detail-card od-detail-content" aria-live="polite"></div>

      <!-- ── Delivery tracking (shown for delivery orders) ── -->
      <div id="orderCourierTracking" class="order-courier-tracking od-tracking dashboard-section" hidden>
        <div class="od-tracking-header">
          <h2 id="orderTrackingTitle" class="od-tracking-title">Sipariş Durumu</h2>
          <span id="orderTrackingLiveBadge" class="fulfillment-live-badge od-live-badge" hidden>Bağlanıyor…</span>
        </div>
        <ol id="orderCourierTrackingSteps" class="order-courier-tracking__steps od-steps"></ol>
        <p id="orderCourierTrackingNote" class="page-message od-tracking-note" hidden></p>
      </div>

      <!-- ── Status history (JS renders here) ── -->
      <div id="orderStatusHistory" class="order-history-list od-history"></div>

    </div>

  </main>
