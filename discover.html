  <!-- 1. Star generator -->
  <script>
  (function(){
    function makeStars(n,W,H){
      var a=[];
      for(var i=0;i<n;i++) a.push((Math.random()*W|0)+'px '+(Math.random()*H|0)+'px #fff');
      return a.join(',');
    }
    var W=Math.max((window.screen&&window.screen.width)||1920,1920);
    var H=Math.max((window.screen&&window.screen.height)||1080,1080)*2;
    var s1=document.getElementById('dpStars1');
    var s2=document.getElementById('dpStars2');
    var s3=document.getElementById('dpStars3');
    if(s1) s1.style.boxShadow=makeStars(1200,W,H);
    if(s2) s2.style.boxShadow=makeStars(280,W,H);
    if(s3) s3.style.boxShadow=makeStars(90,W,H);
  })();
  </script>

  <!-- 2. Filter panel toggle -->
  <script>
  (function(){
    var btn=document.getElementById('dpFilterBtn');
    var panel=document.getElementById('dpFilterPanel');
    if(!btn||!panel) return;
    function open(){
      panel.classList.add('dp-filter-panel--open');
      btn.classList.add('dp-filter-btn--active');
      btn.setAttribute('aria-expanded','true');
      panel.setAttribute('aria-hidden','false');
    }
    function close(){
      panel.classList.remove('dp-filter-panel--open');
      btn.classList.remove('dp-filter-btn--active');
      btn.setAttribute('aria-expanded','false');
      panel.setAttribute('aria-hidden','true');
    }
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      panel.classList.contains('dp-filter-panel--open') ? close() : open();
    });
    document.addEventListener('click',function(e){
      if(!panel.contains(e.target)&&!btn.contains(e.target)) close();
    });
    function updateBadge(){
      var n=document.querySelectorAll('.active-filter').length;
      var badge=document.getElementById('dpFilterCount');
      if(!badge) return;
      badge.textContent=n;
      badge.hidden=(n===0);
    }
    document.addEventListener('click',function(e){
      if(e.target.classList.contains('city-filter-btn')||
         e.target.classList.contains('category-filter-btn'))
        setTimeout(updateBadge,60);
    });
  })();
  </script>

  <!-- 3. Category row grouper (horizontal scroll) -->
  <script>
  (function(){
    var container=document.getElementById('venuesContainer');
    if(!container) return;
    var timer;
    var obs=new MutationObserver(function(){ clearTimeout(timer); timer=setTimeout(run,90); });
    obs.observe(container,{childList:true});
    function run(){
      var cards=Array.from(container.querySelectorAll(':scope > .venue-card'));
      if(!cards.length) return;
      var map=new Map();
      cards.forEach(function(c){
        var m=c.querySelector('.venue-meta');
        var t=m?m.textContent.trim():'';
        var parts=t.split(' / ');
        var cat=parts[parts.length-1].trim()||'Diğer';
        if(!map.has(cat)) map.set(cat,[]);
        map.get(cat).push(c);
      });
      obs.disconnect();
      container.innerHTML='';
      map.forEach(function(items,cat){
        var row=document.createElement('div');
        row.className='venue-row';
        var h=document.createElement('h3');
        h.className='venue-row-heading';
        h.textContent=cat;
        var scroll=document.createElement('div');
        scroll.className='venue-row-scroll';
        items.forEach(function(c){ scroll.appendChild(c); });
        row.appendChild(h);
        row.appendChild(scroll);
        container.appendChild(row);
      });
      obs.observe(container,{childList:true});
    }
  })();
  </script>

  <!-- 4. Heart / favorite injector -->
  <script>
  (function(){
    var STORE='tndk_favs';
    function getFavs(){ try{ return new Set(JSON.parse(localStorage.getItem(STORE)||'[]')); }catch(_){ return new Set(); } }
    function saveFavs(s){ try{ localStorage.setItem(STORE,JSON.stringify([...s])); }catch(_){} }
    function getId(card){
      var a=card.querySelector('a[href*="venue.html"]');
      if(!a) return null;
      var m=(a.getAttribute('href')||'').match(/[?&]id=([^&]+)/);
      return m?decodeURIComponent(m[1]):null;
    }
    function svg(filled){
      return filled
        ? '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ff385c"/></svg>'
        : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linejoin="round"/></svg>';
    }
    function inject(card){
      if(card.querySelector('.dp-heart')) return;
      var id=getId(card);
      var on=!!(id&&getFavs().has(id));
      var btn=document.createElement('button');
      btn.type='button';
      btn.className='dp-heart'+(on?' dp-heart--on':'');
      btn.setAttribute('aria-label','Favorilere ekle');
      btn.innerHTML=svg(on);
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        var favs=getFavs();
        var isOn=btn.classList.toggle('dp-heart--on');
        btn.innerHTML=svg(isOn);
        btn.classList.add('dp-heart--pop');
        setTimeout(function(){ btn.classList.remove('dp-heart--pop'); },350);
        if(id){ if(isOn) favs.add(id); else favs.delete(id); saveFavs(favs); }
      });
      card.appendChild(btn);
    }
    var c=document.getElementById('venuesContainer');
    if(!c) return;
    c.querySelectorAll('.venue-card').forEach(inject);
    new MutationObserver(function(ms){
      ms.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if(n.nodeType!==1) return;
          if(n.classList&&n.classList.contains('venue-card')) inject(n);
          else if(n.querySelectorAll) n.querySelectorAll('.venue-card').forEach(inject);
        });
      });
    }).observe(c,{childList:true,subtree:true});
  })();
  </script>
