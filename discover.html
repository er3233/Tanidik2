<script>
/* ── Venue cards: kategori bazlı yatay satırlara grupla ── */
(function () {
  var container = document.getElementById('venuesContainer');
  if (!container) return;

  var timer;

  var observer = new MutationObserver(function () {
    clearTimeout(timer);
    timer = setTimeout(reorganize, 90);
  });

  observer.observe(container, { childList: true });

  function reorganize() {
    var cards = Array.from(
      container.querySelectorAll(':scope > .venue-card')
    );
    if (cards.length === 0) return;

    /* kategori etiketini venue-meta'dan oku (son parça: "Şehir / Kategori") */
    var groupMap = new Map();
    cards.forEach(function (card) {
      var meta = card.querySelector('.venue-meta');
      var text = meta ? meta.textContent.trim() : '';
      var parts = text.split(' / ');
      var cat = parts[parts.length - 1].trim() || 'Other';
      if (!groupMap.has(cat)) groupMap.set(cat, []);
      groupMap.get(cat).push(card);
    });

    /* DOM değişikliği sırasında observer'ı durdur */
    observer.disconnect();
    container.innerHTML = '';

    groupMap.forEach(function (groupCards, cat) {
      var row = document.createElement('div');
      row.className = 'venue-row';

      var h3 = document.createElement('h3');
      h3.className = 'venue-row-heading';
      h3.textContent = cat;

      var scroll = document.createElement('div');
      scroll.className = 'venue-row-scroll';

      groupCards.forEach(function (c) { scroll.appendChild(c); });

      row.appendChild(h3);
      row.appendChild(scroll);
      container.appendChild(row);
    });

    observer.observe(container, { childList: true });
  }
})();
</script>
